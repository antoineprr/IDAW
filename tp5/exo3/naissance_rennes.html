<!-- Styles -->
<style>
    #chartdiv {
      width: 100%;
      height: 500px;
    }
  </style>
  
  <!-- Resources -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
  
  <!-- Chart code -->
  <script>
    am5.ready(async function () {
  
      // Create root element
      // https://www.amcharts.com/docs/v5/getting-started/#Root_element
      var root = am5.Root.new("chartdiv");
  
      // Set themes
      // https://www.amcharts.com/docs/v5/concepts/themes/
      root.setThemes([am5themes_Animated.new(root)]);
  
      // Create chart
      // https://www.amcharts.com/docs/v5/charts/xy-chart/
      var chart = root.container.children.push(
        am5xy.XYChart.new(root, {
          panX: true,
          panY: true,
          wheelX: "panX",
          wheelY: "zoomX",
          pinchZoomX: true,
          paddingLeft: 0,
          paddingRight: 1,
        })
      );
  
      // Add cursor
      // https://www.amcharts.com/docs/v5/charts/xy-chart/cursor/
      var cursor = chart.set("cursor", am5xy.XYCursor.new(root, {}));
      cursor.lineY.set("visible", false);
  
      // Create axes
      // https://www.amcharts.com/docs/v5/charts/xy-chart/axes/
      var xRenderer = am5xy.AxisRendererX.new(root, {
        minGridDistance: 30,
        minorGridEnabled: true,
      });
  
      xRenderer.labels.template.setAll({
        rotation: -90,
        centerY: am5.p50,
        centerX: am5.p100,
        paddingRight: 15,
      });
  
      xRenderer.grid.template.setAll({
        location: 1,
      });
  
      var xAxis = chart.xAxes.push(
        am5xy.CategoryAxis.new(root, {
          maxDeviation: 0.3,
          categoryField: "annee",
          renderer: xRenderer,
          tooltip: am5.Tooltip.new(root, {}),
        })
      );
  
      var yRenderer = am5xy.AxisRendererY.new(root, {
        strokeOpacity: 0.1,
      });
  
      var yAxis = chart.yAxes.push(
        am5xy.ValueAxis.new(root, {
          maxDeviation: 0.3,
          renderer: yRenderer,
          min: 0,
          max: 5000, 
        })
      );
  
      // Create series
      // https://www.amcharts.com/docs/v5/charts/xy-chart/series/
      var seriesFilles = chart.series.push(
        am5xy.ColumnSeries.new(root, {
          name: "Filles",
          xAxis: xAxis,
          yAxis: yAxis,
          valueYField: "value_fille",
          sequencedInterpolation: true,
          categoryXField: "annee",
          tooltip: am5.Tooltip.new(root, {
            labelText: "{valueY}",
          }),
        })
      );      
  
      seriesFilles.columns.template.setAll({
        cornerRadiusTL: 5,
        cornerRadiusTR: 5,
        strokeOpacity: 0,
      });
      seriesFilles.columns.template.adapters.add("fill", function (fill, target) {
        return chart.get("colors").getIndex(0);
      });
  
      seriesFilles.columns.template.adapters.add("stroke", function (stroke, target) {
        return chart.get("colors").getIndex(0);
      });

      
      var seriesGarcons = chart.series.push(
      am5xy.ColumnSeries.new(root, {
        name: "Garcons",
        xAxis: xAxis,
        yAxis: yAxis,
        valueYField: "value_garcon",
        sequencedInterpolation: true,
        categoryXField: "annee",
        tooltip: am5.Tooltip.new(root, {
          labelText: "{valueY}",
        }),
      })
    );

    seriesGarcons.columns.template.setAll({
      cornerRadiusTL: 5,
      cornerRadiusTR: 5,
      strokeOpacity: 0,
    });

    seriesGarcons.columns.template.adapters.add("fill", function (fill, target) {
      return chart.get("colors").getIndex(10);  
    });

    seriesGarcons.columns.template.adapters.add("stroke", function (stroke, target) {
      return chart.get("colors").getIndex(10);
    });
  
      // Fetch the JSON data
      try {
        let response = await fetch('naissances-a-rennes.json');
        if (!response.ok) {
          throw new Error('Erreur lors du chargement des données');
        }
  
        let donnees = await response.json();
        let data = [];
  
        // Parse the data to extract "annee" and "garcons"
        donnees.forEach((element) => {
          data.push({
            annee: element.annee,
            value_garcon: element.garcons,
            value_fille: element.filles,
          });
        });

        data = data.sort((a, b) => {
          if (a.annee < b.annee) {
            return -1;
          }
        });
  
        // Set the data in the chart
        xAxis.data.setAll(data);
        seriesFilles.data.setAll(data);
        seriesGarcons.data.setAll(data);


        // Create a legend
         var legend = chart.children.push(
          am5.Legend.new(root, {
            centerX: am5.p50,
            x: am5.p50,
          })
        );

        // Set the series in the legend
        legend.data.setAll(chart.series.values);
  
        // Make stuff animate on load
        // https://www.amcharts.com/docs/v5/concepts/animations/
        seriesFilles.appear(1000);
        seriesGarcons.appear(1000);
        chart.appear(1000, 100);
      } catch (error) {
        console.error('Erreur :', error);
      }
    }); // end am5.ready()
  </script>
  
  <!-- HTML -->
  <div id="chartdiv"></div>
